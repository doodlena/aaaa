[project]
name = "lantern"
version = "0.1.0"
description = "Lantern (Northern Virginia) — API, ingestion pipeline, and pilot research tooling"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pdfplumber>=0.11",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "shapely>=2.0",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
translate = ["argostranslate>=1.9"]
ai = ["anthropic>=1.13"]

[project.scripts]
foodaccess = "app.cli:main"
lantern = "app.cli:main"
openshelf = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
