# Official datasets used for pilot-division research. Each entry lists the official URL first, then an
# Internet Archive snapshot of the *same* URL used as a fallback when the official host refuses automated
# requests (www.doe.virginia.gov returned HTTP 403 to automated clients on 2026-10-12). The report records which
# copy was actually used. Verified by source research on 2026-10-12 (docs/pilot_research/SOURCE_DISCOVERY.md).
title_i:
  label: "VDOE 2025-2026 Title I Schools"
  school_year: "2025-2026"            # not a column in the file; taken from the official link text
  landing_page: https://www.doe.virginia.gov/programs-services/federal-programs/essa/title-i/title-i-part-a-improving-basic-programs-operated-by-local-educational-agencies
  urls:
    - https://www.doe.virginia.gov/home/showpublisheddocument/64871/638917252795170000
    - https://web.archive.org/web/20251129015802id_/https://www.doe.virginia.gov/home/showpublisheddocument/64871/638917252795170000
  sheet: DATA
free_reduced_by_school:
  label: "VDOE School Nutrition — Free and Reduced Eligibility Report by School, 2025-2026 (as of Oct 31, 2025)"
  school_year: "2025-2026"
  landing_page: https://www.doe.virginia.gov/programs-services/school-operations-support-services/school-nutrition/program-statistics-reports
  urls:
    - https://www.doe.virginia.gov/home/showpublisheddocument/76094/639081364709900000
    - https://web.archive.org/web/20260421191352id_/https://www.doe.virginia.gov/home/showpublisheddocument/76094/639081364709900000
acs:
  label: "U.S. Census Bureau ACS 2020-2024 5-year Summary File (tables B22003 SNAP, C17002 ratio of income to poverty)"
  year: "2020-2024 ACS 5-year"
  b22003: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b22003.dat
  c17002: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-c17002.dat
