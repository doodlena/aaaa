server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  # Map tiles/styles from OpenFreeMap; fonts are self-hosted. No third-party scripts or trackers.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;  # avoid logging query strings that may contain coordinates
  }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
