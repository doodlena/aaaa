# Open-source stack: PostGIS + FastAPI + static frontend behind nginx. No paid services required.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: foodaccess
      POSTGRES_USER: foodaccess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodaccess"]
      interval: 5s
      retries: 20
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      FOODACCESS_DATABASE_URL: postgresql+psycopg://foodaccess:${POSTGRES_PASSWORD}@db:5432/foodaccess
      FOODACCESS_ENVIRONMENT: ${FOODACCESS_ENVIRONMENT:-production}
      FOODACCESS_COOKIE_SECURE: ${FOODACCESS_COOKIE_SECURE:-true}
      FOODACCESS_CORS_ORIGINS: ${FOODACCESS_CORS_ORIGINS:-["http://localhost:8080"]}
      FOODACCESS_SHOW_SYNTHETIC: ${FOODACCESS_SHOW_SYNTHETIC:-false}
      # Optional OpenID Connect sign-in (off while these are empty)
      FOODACCESS_OIDC_ISSUER: ${FOODACCESS_OIDC_ISSUER:-}
      FOODACCESS_OIDC_CLIENT_ID: ${FOODACCESS_OIDC_CLIENT_ID:-}
      FOODACCESS_OIDC_CLIENT_SECRET: ${FOODACCESS_OIDC_CLIENT_SECRET:-}
      FOODACCESS_OIDC_PROVIDER_NAME: ${FOODACCESS_OIDC_PROVIDER_NAME:-}
      FOODACCESS_OIDC_REDIRECT_URL: ${FOODACCESS_OIDC_REDIRECT_URL:-}
    volumes: [./reports:/app/reports]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["8080:80"]
    depends_on: [api]
  # Optional self-hosted machine translation (enable with: docker compose --profile translate up)
  libretranslate:
    image: libretranslate/libretranslate:v1.6.2
    profiles: [translate]
    environment: {LT_LOAD_ONLY: "en,es"}
volumes:
  pgdata:
